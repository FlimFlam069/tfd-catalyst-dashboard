<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05080d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TFD Catalyst"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="catalyst.jpg"><title>Crystallization Catalyst</title><style>body{margin:0;background:#05080d;color:#f7f9fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px}.app{max-width:860px;margin:auto}.card{background:#0b1119;border:1px solid #1d4d77;border-radius:20px;padding:16px;margin-bottom:14px}.hero img,.brandicon{max-width:100%;border-radius:18px}.brandicon{width:46px;height:46px;object-fit:cover}.top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.title{font-size:24px;font-weight:900}.sub{color:#55a0ff;font-size:13px}.live{color:#62f06f;font-weight:900}.count{font-size:56px;font-weight:950;color:#62f06f}.state{font-size:34px;font-weight:950}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#0d141e;border:1px solid #162536;border-radius:14px;padding:14px}.muted{color:#93a0b3;font-size:13px}.label{color:#55a0ff;font-size:12px;font-weight:900;text-transform:uppercase}.playing{color:#b15cff}.good{color:#62f06f}.warn{color:#f4cb4a}.bad{color:#ff6674}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.action,button{min-height:72px;border-radius:14px;border:1px solid #1d4d77;background:#0e1622;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:900}@media(min-width:720px){.actions{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="app"><header class="top"><img class="brandicon" src="catalyst.jpg" alt="Catalyst"><div><div class="title">CRYSTALLIZATION CATALYST</div><div class="sub">TFD Automation Dashboard</div></div><div class="live">LIVE ●</div></header><section class="card hero"><img src="catalyst.jpg" alt="Crystallization Catalyst"><div class="label">Current Status</div><div id="researchState" class="state">LOADING</div><div id="countdown" class="count">--:--:--</div><div id="completeAt" class="muted">Waiting for status…</div></section><section class="card"><div class="grid"><div class="box"><div class="label">Research Loop</div><strong id="loopHealth">—</strong><div id="loopMeta" class="muted">—</div></div><div class="box"><div class="label">Watchdog</div><strong id="watchHealth">—</strong><div id="watchMeta" class="muted">—</div></div></div></section><section class="actions"><button id="refresh">↻ REFRESH</button><a class="action" href="https://github.com/FlimFlam069/-tfd-companion-automation/actions/workflows/research-auto.yml" target="_blank" rel="noopener">▶ RUN NOW</a><a class="action" href="https://github.com/FlimFlam069/-tfd-companion-automation/issues/1" target="_blank" rel="noopener">▤ EVENT LOG</a><a class="action" href="https://github.com/FlimFlam069/tfd-catalyst-dashboard" target="_blank" rel="noopener">⚙ SETTINGS</a></section></div><script>(()=>{const $=id=>document.getElementById(id);let research=null,watchdog=null;const parse=d=>d?new Date(d):null;const ageMin=d=>d&&!Number.isNaN(d.getTime())?(Date.now()-d.getTime())/60000:Infinity;const fmtAge=m=>!Number.isFinite(m)?'unknown':m<1?'<1 min':m<60?`${Math.floor(m)} min`:`${Math.floor(m/60)}h ${Math.floor(m%60)}m`;function fmtDuration(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`}function render(){const rc=parse(research?.checked_at),wc=parse(watchdog?.checked_at),ra=ageMin(rc),wa=ageMin(wc),playing=research?.status==='deferred_game_active';let loopText=ra<45?'HEALTHY':'ATTENTION',loopClass=ra<45?'good':'bad';if(playing){loopText='PLAYING / DEFERRED';loopClass='playing'}$('loopHealth').textContent=loopText;$('loopHealth').className=loopClass;$('loopMeta').textContent=playing?`Game-active defer • ${fmtAge(ra)} old`:`${fmtAge(ra)} old`;$('watchHealth').textContent=wa<60?'HEALTHY':'ATTENTION';$('watchHealth').className=wa<60?'good':'bad';$('watchMeta').textContent=watchdog?.checked_at?`${fmtAge(wa)} old`:'Waiting for heartbeat';$('researchState').textContent=playing?'PLAYING / DEFERRED':(research?.status||'unknown').replaceAll('_',' ').toUpperCase();$('researchState').className='state '+(playing?'playing':'');const c=parse(research?.estimated_complete_at);if(research?.status==='researching'&&c){const left=(c-Date.now())/1000;$('countdown').textContent=left>0?fmtDuration(left):'READY';$('completeAt').textContent=`Expected ${c.toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})}`}else if(playing){$('countdown').textContent='IN GAME';$('completeAt').textContent='Claim/restart intentionally deferred while TFD is active. This is not a failure.'}else{$('countdown').textContent='--:--:--';$('completeAt').textContent=research?.detail||'Status unavailable'}}async function getJson(p){const r=await fetch(`${p}?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error();return r.json()}async function load(){const[r,w]=await Promise.allSettled([getJson('status.json'),getJson('watchdog-status.json')]);if(r.status==='fulfilled')research=r.value;if(w.status==='fulfilled')watchdog=w.value;render()}$('refresh').addEventListener('click',load);load();setInterval(render,1000);setInterval(load,60000)})();</script></body></html>
