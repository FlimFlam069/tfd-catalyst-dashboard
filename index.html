<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05080d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TFD Catalyst"><link rel="manifest" href="manifest.webmanifest"><title>Crystallization Catalyst</title><style>body{margin:0;background:#05080d;color:#f7f9fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px}.app{max-width:860px;margin:auto}.card{background:#0b1119;border:1px solid #1d4d77;border-radius:20px;padding:16px;margin-bottom:14px}.hero img,.brandicon{max-width:100%;border-radius:18px}.hero img{width:100%;display:block;margin-bottom:12px}.brandicon{width:46px;height:46px;object-fit:cover}.top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.title{font-size:24px;font-weight:900}.sub{color:#55a0ff;font-size:13px}.live{color:#62f06f;font-weight:900}.count{font-size:56px;font-weight:950;color:#62f06f}.state{font-size:34px;font-weight:950}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#0d141e;border:1px solid #162536;border-radius:14px;padding:14px}.muted{color:#93a0b3;font-size:13px}.label{color:#55a0ff;font-size:12px;font-weight:900;text-transform:uppercase}.playing{color:#b15cff}.good{color:#62f06f}.bad{color:#ff6674}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.action,button{min-height:72px;border-radius:14px;border:1px solid #1d4d77;background:#0e1622;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;font-weight:900;padding:8px}.tiny{font-size:12px;color:#93a0b3}.tiny a{color:#55a0ff;text-decoration:none}@media(min-width:720px){.actions{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="app"><header class="top"><img id="brandArt" class="brandicon" alt="Catalyst"><div><div class="title">CRYSTALLIZATION CATALYST</div><div class="sub">TFD Automation Dashboard</div></div><div id="liveFlag" class="live">LIVE ●</div></header><section class="card hero"><img id="heroArt" alt="Crystallization Catalyst"><div class="label">Current Status</div><div id="researchState" class="state">LOADING</div><div id="countdown" class="count">--:--:--</div><div id="completeAt" class="muted">Waiting for status…</div></section><section class="card"><div class="grid"><div class="box"><div class="label">Research Loop</div><strong id="loopHealth">—</strong><div id="loopMeta" class="muted">—</div><div id="loopRun" class="tiny"></div></div><div class="box"><div class="label">Watchdog</div><strong id="watchHealth">—</strong><div id="watchMeta" class="muted">—</div><div id="watchRun" class="tiny"></div></div></div></section><section class="actions"><button id="refresh">↻ REFRESH</button><a class="action" href="https://github.com/FlimFlam069/-tfd-companion-automation/actions/workflows/research-auto.yml" target="_blank" rel="noopener">▶ RUN RESEARCH</a><a class="action" href="https://github.com/FlimFlam069/-tfd-companion-automation/actions/workflows/research-watchdog.yml" target="_blank" rel="noopener">🛡 RUN WATCHDOG</a><a class="action" href="https://github.com/FlimFlam069/-tfd-companion-automation/issues/1" target="_blank" rel="noopener">▤ EVENT LOG</a></section><div class="tiny" style="margin-top:12px">Manual run buttons open GitHub because the dashboard never stores your private GitHub token.</div></div><script>(()=>{const $=id=>document.getElementById(id);let research=null,watchdog=null;const repo='https://github.com/FlimFlam069/-tfd-companion-automation';const parse=d=>d?new Date(d):null;const ageMin=d=>d&&!Number.isNaN(d.getTime())?(Date.now()-d.getTime())/60000:Infinity;const fmtAge=m=>!Number.isFinite(m)?'unknown':m<1?'<1 min':m<60?`${Math.floor(m)} min`:`${Math.floor(m/60)}h ${Math.floor(m%60)}m`;function fmtDuration(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`}function runLink(id,num){return id?`<a href="${repo}/actions/runs/${id}" target="_blank" rel="noopener">Run #${num||id}</a>`:''}async function loadArt(){try{const r=await fetch(`catalyst.b64?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error();const b=(await r.text()).trim();const src='data:image/webp;base64,'+b;$('brandArt').src=src;$('heroArt').src=src}catch(e){$('brandArt').style.display='none';$('heroArt').style.display='none'}}function render(){const rc=parse(research?.checked_at),wc=parse(watchdog?.checked_at),ra=ageMin(rc),wa=ageMin(wc),playing=research?.status==='deferred_game_active',loopFresh=ra<45,watchFresh=wa<60;$('loopHealth').textContent=loopFresh?'HEALTHY':'ATTENTION';$('loopHealth').className=loopFresh?'good':'bad';$('loopMeta').textContent=playing?`TFD: PLAYING / DEFERRED • heartbeat ${fmtAge(ra)} old`:`${fmtAge(ra)} old`;$('watchHealth').textContent=watchFresh?'HEALTHY':'ATTENTION';$('watchHealth').className=watchFresh?'good':'bad';$('watchMeta').textContent=watchdog?.checked_at?`${fmtAge(wa)} old`:'Waiting for heartbeat';$('loopRun').innerHTML=runLink(research?.github_run_id,research?.github_run_number);$('watchRun').innerHTML=runLink(watchdog?.github_run_id,watchdog?.github_run_number);const allFresh=loopFresh&&watchFresh;$('liveFlag').textContent=allFresh?'LIVE ●':'ATTENTION ●';$('liveFlag').className=allFresh?'live':'bad';$('researchState').textContent=playing?'PLAYING / DEFERRED':(research?.status||'unknown').replaceAll('_',' ').toUpperCase();$('researchState').className='state '+(playing?'playing':'');const c=parse(research?.estimated_complete_at);if(research?.status==='researching'&&c){const left=(c-Date.now())/1000;$('countdown').textContent=left>0?fmtDuration(left):'READY';$('completeAt').textContent=`Expected ${c.toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})}`}else if(playing){$('countdown').textContent='IN GAME';$('completeAt').textContent=loopFresh?'Claim/restart intentionally deferred while TFD is active. This is not a TFD failure.':'TFD is active, so claim/restart is deferred. Separately, the research-loop heartbeat is stale and needs attention.'}else{$('countdown').textContent='--:--:--';$('completeAt').textContent=research?.detail||'Status unavailable'}}async function getJson(p){const r=await fetch(`${p}?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error();return r.json()}async function load(){const b=$('refresh');b.disabled=true;b.textContent='↻ REFRESHING';const[r,w]=await Promise.allSettled([getJson('status.json'),getJson('watchdog-status.json')]);if(r.status==='fulfilled')research=r.value;if(w.status==='fulfilled')watchdog=w.value;render();b.disabled=false;b.textContent='↻ REFRESH'}$('refresh').addEventListener('click',load);loadArt();load();setInterval(render,1000);setInterval(load,60000)})();</script></body></html>
